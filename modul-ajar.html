<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Modul Ajar PM — SIMPELM</title>
<link rel="stylesheet" href="assets/css/app.css" />
</head>
<body>
<header id="navbar"></header>

<section class="page-head" style="--ph:var(--m4);">
  <div class="container">
    <span class="kicker">Modul 4</span>
    <h1>Modul Ajar Pembelajaran Mendalam</h1>
    <p>Repositori modul ajar PM karya Ketua KKG Sekolah se-Deli Serdang — praktik pedagogis, pemanfaatan digital, modul ajar, dan asesmen sumatif.</p>
  </div>
</section>

<main class="page-body">
  <div class="container">

    <!-- Panel KKG Sekolah: aksi buat laporan -->
    <div id="ownerPanel" class="hidden">
      <div class="sec-title">
        <h2>Laporan Modul Ajar Saya</h2>
        <button class="btn btn-primary btn-sm" id="btnAddLaporan">+ Buat Laporan</button>
      </div>
    </div>

    <!-- Daftar laporan publik -->
    <div class="sec-title" id="pubTitle"><h2>Daftar Laporan Modul Ajar PM</h2><span class="sub">Referensi untuk seluruh guru</span></div>
    <div class="toolbar">
      <div class="grow"><label>Cari</label><input type="search" id="search" placeholder="Cari sekolah, mapel…" /></div>
      <div><label>Kelas</label><select id="fKelas"><option value="">Semua</option></select></div>
      <div><label>Mata Pelajaran</label><select id="fMapel"><option value="">Semua</option></select></div>
      <div><label>Semester</label><select id="fSem"><option value="">Semua</option></select></div>
    </div>
    <div id="table"></div>
  </div>
</main>

<footer id="footer"></footer>

<!-- Modal Laporan -->
<div class="modal-overlay" id="lapModal">
  <div class="modal">
    <div class="modal-head"><h3 id="lapTitle">Buat Laporan Modul Ajar</h3><button class="modal-close" data-close>&times;</button></div>
    <form id="lapForm">
      <div class="modal-body">
        <input type="hidden" id="l_id" />
        <div class="form-grid">
          <div class="field"><label>Kelas <span class="req">*</span></label><select id="l_kelas" required></select></div>
          <div class="field"><label>Mata Pelajaran <span class="req">*</span></label><select id="l_mapel" required></select></div>
        </div>
        <div class="field"><label>Elemen <span class="req">*</span></label><input id="l_elemen" maxlength="150" placeholder="cth: Bilangan / Membaca dan Memirsa" required /></div>
        <div class="field"><label>Capaian Pembelajaran <span class="req">*</span></label><textarea id="l_capaian" maxlength="700" placeholder="Capaian Pembelajaran (CP) sesuai fase/elemen…" required></textarea></div>
        <div class="field"><label>Tujuan Pembelajaran <span class="req">*</span></label><textarea id="l_tujuan" maxlength="500" placeholder="Tujuan Pembelajaran (TP) yang diturunkan dari CP…" required></textarea></div>
        <div class="form-grid">
          <div class="field"><label>Semester <span class="req">*</span></label><select id="l_semester" required></select></div>
          <div class="field"><label>Tahun Ajaran <span class="req">*</span></label><input id="l_tahun_ajaran" placeholder="2026/2027" required /></div>
        </div>
        <div class="field"><label>Deskripsi Praktik Pedagogis <span class="req">*</span></label><textarea id="l_pedagogis" maxlength="500" placeholder="Strategi/metode PM: PjBL, Inkuiri, CTL…" required></textarea></div>
        <div class="field"><label>Deskripsi Pemanfaatan Digital <span class="req">*</span></label><textarea id="l_digital" maxlength="500" placeholder="Platform/tools digital dalam PM…" required></textarea></div>
        <div class="field"><label>Link Modul Ajar / RPP <span class="req">*</span></label><input id="l_modul" placeholder="https://docs.google.com/…" required /></div>
        <div class="field"><label>Link Asesmen Sumatif</label><input id="l_asesmen" placeholder="https://forms.gle/… (opsional)" /></div>
      </div>
      <div class="modal-foot"><button type="button" class="btn btn-ghost btn-sm" data-close>Batal</button><button type="submit" class="btn btn-primary btn-sm">Simpan Laporan</button></div>
    </form>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
<script>
  let laporan = [];
  const sess = Session.get();
  const isOwner = sess && sess.role === "kkg_sekolah";

  document.addEventListener("DOMContentLoaded", () => {
    setupModals();
    document.getElementById("l_kelas").innerHTML = optionList(CONFIG.KELAS);
    document.getElementById("l_mapel").innerHTML = optionList(CONFIG.MAPEL);
    document.getElementById("l_semester").innerHTML = optionList(CONFIG.SEMESTER);
    document.getElementById("fKelas").innerHTML = '<option value="">Semua</option>' + optionList(CONFIG.KELAS);
    document.getElementById("fMapel").innerHTML = '<option value="">Semua</option>' + optionList(CONFIG.MAPEL);
    document.getElementById("fSem").innerHTML = '<option value="">Semua</option>' + optionList(CONFIG.SEMESTER);
    ["search","fKelas","fMapel","fSem"].forEach(id => document.getElementById(id).addEventListener("input", render));

    if (isOwner) {
      document.getElementById("ownerPanel").classList.remove("hidden");
      document.getElementById("btnAddLaporan").onclick = () => openLaporan();
    }
    document.getElementById("lapForm").addEventListener("submit", saveLaporan);
    load();
  });

  async function load() {
    UI.loading(true);
    try {
      laporan = await API.call("listLaporan", {}, { auth: Session.isLoggedIn(), cacheMinutes: Session.isLoggedIn()?0:CONFIG.PUBLIC_CACHE_MINUTES });
      render();
    } catch (err) { UI.toast(err.message, "error", 4000); }
    finally { UI.loading(false); }
  }

  function render() {
    const q = document.getElementById("search").value.toLowerCase().trim();
    const kelas = document.getElementById("fKelas").value, mapel = document.getElementById("fMapel").value, sem = document.getElementById("fSem").value;
    let rows = laporan.filter(r => {
      if (q && !(`${r.sekolah} ${r.mapel} ${r.kelas} ${r.elemen||""}`.toLowerCase().includes(q))) return false;
      if (kelas && r.kelas !== kelas) return false;
      if (mapel && r.mapel !== mapel) return false;
      if (sem && r.semester !== sem) return false;
      return true;
    });
    const cols = [
      { key: "sekolah", label: "Sekolah" },
      { key: "kelas", label: "Kelas" },
      { key: "mapel", label: "Mapel" },
      { key: "elemen", label: "Elemen", render: r => escapeHtml(r.elemen || "-") },
      { key: "semester", label: "Semester", render: r => `${escapeHtml(r.semester)}<br><span class="text-muted" style="font-size:12px">${escapeHtml(r.tahun_ajaran||"")}</span>` },
      { key: "_links", label: "Modul & Asesmen", render: r => `<div class="link-row">${linkPill(r.link_modul_ajar,"📘 Modul")}${linkPill(r.link_asesmen_sumatif,"📝 Asesmen")}${r.canEdit?`<button class="link-pill" data-edit-lap="${r.id}">Edit</button>`:""}</div>` }
    ];
    new DataTable({ mount: "#table", columns: cols, rows, emptyText: "Belum ada laporan modul ajar." });
    document.getElementById("table").querySelectorAll("[data-edit-lap]").forEach(el => el.onclick = () => openLaporan(el.dataset.editLap));
  }

  /* ---- Laporan ---- */
  function openLaporan(id) {
    document.getElementById("lapForm").reset();
    document.getElementById("l_id").value = "";
    document.getElementById("lapTitle").textContent = id ? "Edit Laporan" : "Buat Laporan Modul Ajar";
    if (id) {
      const r = laporan.find(x => x.id == id);
      document.getElementById("l_id").value = r.id;
      document.getElementById("l_kelas").value = r.kelas;
      document.getElementById("l_mapel").value = r.mapel;
      document.getElementById("l_elemen").value = r.elemen || "";
      document.getElementById("l_capaian").value = r.capaian_pembelajaran || "";
      document.getElementById("l_tujuan").value = r.tujuan_pembelajaran || "";
      document.getElementById("l_semester").value = r.semester;
      document.getElementById("l_tahun_ajaran").value = r.tahun_ajaran;
      document.getElementById("l_pedagogis").value = r.deskripsi_praktik_pedagogis;
      document.getElementById("l_digital").value = r.deskripsi_digital;
      document.getElementById("l_modul").value = r.link_modul_ajar;
      document.getElementById("l_asesmen").value = r.link_asesmen_sumatif;
    }
    show("lapModal");
  }
  async function saveLaporan(e) {
    e.preventDefault();
    const data = {
      id: document.getElementById("l_id").value,
      kelas: document.getElementById("l_kelas").value,
      mapel: document.getElementById("l_mapel").value,
      elemen: document.getElementById("l_elemen").value.trim(),
      capaian_pembelajaran: document.getElementById("l_capaian").value.trim(),
      tujuan_pembelajaran: document.getElementById("l_tujuan").value.trim(),
      semester: document.getElementById("l_semester").value,
      tahun_ajaran: document.getElementById("l_tahun_ajaran").value.trim(),
      deskripsi_praktik_pedagogis: document.getElementById("l_pedagogis").value.trim(),
      deskripsi_digital: document.getElementById("l_digital").value.trim(),
      link_modul_ajar: document.getElementById("l_modul").value.trim(),
      link_asesmen_sumatif: document.getElementById("l_asesmen").value.trim()
    };
    if (!isValidUrl(data.link_modul_ajar)) return UI.toast("Link Modul Ajar harus diawali https://", "error");
    if (data.link_asesmen_sumatif && !isValidUrl(data.link_asesmen_sumatif)) return UI.toast("Link Asesmen harus diawali https://", "error");
    UI.loading(true);
    try { await API.call("saveLaporan", { data }, { auth: true }); API.invalidate(); hideAll(); UI.toast("Laporan tersimpan.", "success"); await load(); }
    catch (err) { UI.toast(err.message, "error", 4000); }
    finally { UI.loading(false); }
  }

  function show(id){ document.getElementById(id).classList.add("show"); }
  function hideAll(){ document.querySelectorAll(".modal-overlay").forEach(m=>m.classList.remove("show")); }
  function setupModals(){
    document.querySelectorAll("[data-close]").forEach(b=>b.onclick=hideAll);
    document.querySelectorAll(".modal-overlay").forEach(ov=>{
      let downOnOverlay=false;
      ov.addEventListener("mousedown",e=>{ downOnOverlay=(e.target===ov); });
      ov.addEventListener("click",e=>{ if(e.target===ov && downOnOverlay && !ov.querySelector("input, textarea, select")) hideAll(); });
    });
  }
</script>
</body>
</html>
